version: 2

project_name: docpack

builds:
  - id: docpack
    main: ./cmd/docpack
    binary: docpack
    env:
      - CGO_ENABLED=0
    goos: [linux, windows, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: docpack
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - SPEC.md
      - CHANGELOG.md
      - kit/README.md
      - kit/CLAUDE.md
      - kit/skeletons/*.md
      - kit/examples/*.md
      - kit/prompts/*.md
      - schemas/1.0/*.json
      - schemas/1.0/data/*.json

checksum:
  name_template: checksums.txt

# Keyless signing: cosign gets a short-lived certificate for the release
# workflow's GitHub OIDC identity and records the signature in the public
# transparency log. The bundle holds the signature and the certificate.
signs:
  - id: cosign
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github

release:
  draft: true
  name_template: "docpack {{ .Version }}"
