name: release

# Runs when a version tag is pushed, for example: git tag v0.1.1 && git push origin v0.1.1
on:
  push:
    tags: ["v*"]

permissions:
  contents: write     # create the release and upload assets
  id-token: write     # OIDC identity for cosign keyless signing and attestations
  attestations: write # store the build provenance attestations

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test before releasing
        run: go test ./... && go run ./cmd/docpack check example/ --warnings-as-errors
      - uses: sigstore/cosign-installer@v3
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
