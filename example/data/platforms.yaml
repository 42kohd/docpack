- os: linux
  version: Kernel 4.18 or later (RHEL 8+, Debian 11+, Ubuntu 20.04+)
  arch: [amd64, arm64]
  capabilities:
    service_manager: true
    file_events: true
    compression: true
    client_certificates: true
- os: windows
  version: Windows Server 2019+, Windows 10+
  arch: [amd64, arm64]
  capabilities:
    service_manager: true
    file_events: true
    compression: true
    client_certificates: true
- os: macos
  version: macOS 13+
  arch: [amd64, arm64]
  capabilities:
    service_manager: true
    file_events: true
    compression: true
    client_certificates: false
- os: freebsd
  version: FreeBSD 13+
  arch: [amd64]
  capabilities:
    service_manager: false
    file_events: false
    compression: true
    client_certificates: true
