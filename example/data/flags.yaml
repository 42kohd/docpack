# Core
- name: --config
  group: core
  type: path
  default: agent.yaml
  env: LF_CONFIG
  description: Configuration file to read. Flags on the command line override values in the file.
  platforms: [linux, windows, macos, freebsd]
  status: ga
  since: 1.0.0
- name: --log-level
  group: core
  type: string
  default: info
  env: LF_LOG_LEVEL
  description: "Agent log detail: error, warn, info or debug."
  platforms: [linux, windows, macos, freebsd]
  status: ga
  since: 1.0.0
- name: --state-dir
  group: core
  type: path
  default: ./state
  env: LF_STATE_DIR
  description: Directory where the agent keeps read offsets and unsent batches between restarts.
  platforms: [linux, windows, macos, freebsd]
  status: ga
  since: 1.0.0
- name: --verbosity
  group: core
  type: string
  default: standard
  env: LF_VERBOSITY
  description: "Which fields each record carries: minimal, standard or verbose."
  platforms: [linux, windows, macos, freebsd]
  status: ga
  since: 1.2.0
# Input
- name: --input-path
  group: input
  type: list
  default: null
  env: LF_INPUT_PATH
  description: Files or glob patterns to read. Repeat the flag for more than one pattern.
  platforms: [linux, windows, macos, freebsd]
  status: ga
  since: 1.0.0
- name: --input-exclude
  group: input
  type: list
  default: null
  env: LF_INPUT_EXCLUDE
  description: Glob patterns to skip, applied after --input-path.
  platforms: [linux, windows, macos, freebsd]
  status: ga
  since: 1.1.0
- name: --read-from
  group: input
  type: string
  default: end
  env: LF_READ_FROM
  description: "Where to start in a file seen for the first time: end or start."
  platforms: [linux, windows, macos, freebsd]
  status: ga
  since: 1.0.0
- name: --poll-interval
  group: input
  type: duration
  default: 2s
  env: LF_POLL_INTERVAL
  description: How often to check files for new lines when file events are not available.
  platforms: [linux, windows, macos, freebsd]
  status: ga
  since: 1.0.0
- name: --multiline-start
  group: input
  type: string
  default: null
  env: LF_MULTILINE_START
  description: A regular expression that marks the first line of a record. Lines that do not match join the previous record.
  platforms: [linux, windows, macos, freebsd]
  status: prerelease
  since: 1.4.0
# Output
- name: --output
  group: output
  type: string
  default: forward
  env: LF_OUTPUT
  description: "Where records go: forward to a warehouse, or file to write them locally."
  platforms: [linux, windows, macos, freebsd]
  status: ga
  since: 1.0.0
- name: --output-dir
  group: output
  type: path
  default: ./out
  env: LF_OUTPUT_DIR
  description: Directory for output files when --output is file.
  platforms: [linux, windows, macos, freebsd]
  status: ga
  since: 1.0.0
- name: --output-format
  group: output
  type: string
  default: jsonl
  env: LF_OUTPUT_FORMAT
  description: "Format of output files: jsonl or csv."
  platforms: [linux, windows, macos, freebsd]
  status: ga
  since: 1.1.0
- name: --rotate-size
  group: output
  type: int
  default: 64
  env: LF_ROTATE_SIZE
  description: Size in megabytes at which the current output file is closed and a new one started.
  platforms: [linux, windows, macos, freebsd]
  status: ga
  since: 1.3.0
- name: --rotate-keep
  group: output
  type: int
  default: 5
  env: LF_ROTATE_KEEP
  description: Number of closed output files to keep. Older files are deleted.
  platforms: [linux, windows, macos, freebsd]
  status: ga
  since: 1.3.0
# Forwarders
- name: --forward-to
  group: forwarders
  type: string
  default: null
  env: LF_FORWARD_TO
  description: "Forwarder target: warehouse-a or warehouse-b."
  platforms: [linux, windows, macos, freebsd]
  status: ga
  since: 1.0.0
- name: --batch-size
  group: forwarders
  type: int
  default: 500
  env: LF_BATCH_SIZE
  description: Maximum number of records in one batch.
  platforms: [linux, windows, macos, freebsd]
  status: ga
  since: 1.3.0
- name: --flush-interval
  group: forwarders
  type: duration
  default: 5s
  env: LF_FLUSH_INTERVAL
  description: Maximum time a record waits before its batch is sent, even if the batch is not full.
  platforms: [linux, windows, macos, freebsd]
  status: ga
  since: 1.0.0
- name: --retry-max
  group: forwarders
  type: int
  default: 8
  env: LF_RETRY_MAX
  description: Attempts per batch before it is parked in the state directory. Waits double after each attempt, up to 60 seconds.
  platforms: [linux, windows, macos, freebsd]
  status: ga
  since: 1.0.0
- name: --compress
  group: forwarders
  type: bool
  default: true
  env: LF_COMPRESS
  description: Compress each batch before sending it.
  platforms: [linux, windows, macos, freebsd]
  status: ga
  since: 1.0.0
- name: --batch-records
  group: forwarders
  type: int
  default: 500
  env: ""
  description: Former name of --batch-size.
  platforms: [linux, windows, macos, freebsd]
  status: deprecated
  replaced_by: --batch-size
  since: 1.0.0
