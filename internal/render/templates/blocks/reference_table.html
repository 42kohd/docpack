{{define "block/reference_table"}}{{$src := .Source}}<div class="table reference" data-source="{{.Source}}"><table>
<thead><tr>{{range .Columns}}<th>{{.}}</th>{{end}}</tr></thead>
<tbody>{{range .RefRows}}<tr>{{range $i, $c := .}}<td>{{if cellcode $src $i}}<code>{{sub $c}}</code>{{else}}{{sub $c}}{{end}}</td>{{end}}</tr>{{end}}</tbody>
</table></div>{{end}}
